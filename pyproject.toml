[project]
name = "song-to-tab"
version = "0.1.0"
description = "A Python project for converting songs to guitar tabs"
readme = "README.md"
authors = [
    { name = "mcprins", email = "marnix.prins@alliander.com" }
]
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
song-to-tab = "song_to_tab:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ruff configuration
[tool.ruff]
# Set the maximum line length to 88 (same as Black)
line-length = 88
# Target Python 3.8+ syntax
target-version = "py38"

# Enable specific linting rules
[tool.ruff.lint]
# Enable a comprehensive set of rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]

# Ignore specific rules if needed
ignore = [
    "E501",  # line too long (handled by formatter)
]

# Allow auto-fixing for specific rules
fixable = ["I", "F401"]  # Fix imports and unused imports

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Automatically detect line endings
line-ending = "auto"

# Configure import sorting (like isort)
[tool.ruff.lint.isort]
known-first-party = ["song_to_tab"]
force-single-line = false
lines-after-imports = 2

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --cov=src --cov-report=term-missing"
